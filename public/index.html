<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENAS | Perfumes Árabes Originales y Decants en Lima - Lattafa, Rasasi</title>
    
    <!-- ETIQUETA DE GOOGLE SEARCH CONSOLE -->
    <meta name="google-site-verification" content="b-YjZAn1x0ai3hTZgX6fH4z_e5kpKlsoQGAz4tTgUFk" />
    
    <meta name="description" content="Compra perfumes árabes originales y decants de 5 ml, 10 ml y 15 ml en Lima, Perú. Lattafa Khamrah, Asad Bourbon, Rasasi Hawas Ice y más. Pago por Yape/Plin y delivery en Lima.">
    <meta name="keywords" content="perfumes árabes Lima, decants perfumes árabes Lima, Khamrah Lattafa Perú, Hawas Ice Rasasi, Asad Bourbon, perfumes originales San Miguel Lima, Tienda ARENAS">
    <link rel="canonical" href="https://tienda-arenas.onrender.com/" />

    <!-- OPEN GRAPH PARA WHATSAPP Y REDES SOCIALES -->
    <meta property="og:title" content="ARENAS | Perfumes Árabes Originales y Decants en Lima" />
    <meta property="og:description" content="Arma tu pedido online, genera tu boleta digital al instante y paga seguro con Yape o Plin. Delivery en todo Lima." />
    <meta property="og:url" content="https://tienda-arenas.onrender.com/" />
    <meta property="og:type" content="website" />

    <!-- DATOS ESTRUCTURADOS JSON-LD PARA GOOGLE -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Store",
          "name": "Tienda ARENAS",
          "description": "Tienda online de perfumes árabes originales y decants en Lima, Perú.",
          "url": "https://tienda-arenas.onrender.com/",
          "areaServed": {
            "@type": "City",
            "name": "Lima"
          },
          "paymentAccepted": "Yape, Plin",
          "currenciesAccepted": "PEN"
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "¿Los perfumes árabes son 100% originales?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sí, en ARENAS trabajamos exclusivamente con perfumes árabes originales de marcas como Lattafa, Rasasi, Afnan, Armaf y Al Haramain con garantía en Lima."
              }
            },
            {
              "@type": "Question",
              "name": "¿Cómo se realizan los pagos?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Aceptamos pagos rápidos y seguros mediante Yape y Plin directo al número oficial de la tienda."
              }
            },
            {
              "@type": "Question",
              "name": "¿Cómo funciona el delivery en Lima?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Realizamos envíos seguros a todo Lima metropolitana con una tarifa plana de S/ 12.00, coordinando directamente por WhatsApp tras generar tu boleta."
              }
            }
          ]
        }
      ]
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            overflow-x: hidden;
            background-color: #f8f8f8;
            color: #111111;
            font-family: 'Helvetica Neue', 'Arial', sans-serif;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in-card {
            animation: fadeInUp 0.45s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
            opacity: 0;
        }

        .perfume-card {
            transition: all 0.25s ease;
        }
        .perfume-card:hover {
            transform: translateY(-4px);
            border-color: #111111;
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.14);
        }

        .perfume-img {
            transition: transform 0.45s ease;
        }
        .perfume-card:hover .perfume-img {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CART_STORAGE_KEY = 'arenas_cart_v1';

        const detectBadge = (perfume) => {
            const text = `${perfume.name || ''} ${perfume.desc || ''}`.toLowerCase();
            if (text.includes('decant') || text.includes('ml')) return 'Formato / Decant';
            if (text.includes('verano') || text.includes('fresco') || text.includes('hawas')) return 'Fresco / Diario';
            if (text.includes('invierno') || text.includes('noche') || text.includes('khamrah') || text.includes('asad')) return 'Intenso / Noche';
            return 'Original';
        };

        const App = () => {
            const [storeData, setStoreData] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedBrand, setSelectedBrand] = useState('Todos');
            const [cart, setCart] = useState(() => {
                try {
                    const saved = localStorage.getItem(CART_STORAGE_KEY);
                    return saved ? JSON.parse(saved) : [];
                } catch {
                    return [];
                }
            });
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [showReceiptModal, setShowReceiptModal] = useState(false);
            const [receiptDownloaded, setReceiptDownloaded] = useState(false);
            const [copiedYape, setCopiedYape] = useState(false);
            const [copiedSummary, setCopiedSummary] = useState(false);
            const [customerName, setCustomerName] = useState('');
            const [customerDistrict, setCustomerDistrict] = useState('');
            const receiptRef = useRef(null);

            const SHIPPING_COST = 12;

            useEffect(() => {
                fetch('/api/data')
                    .then(res => res.json())
                    .then(data => setStoreData(data))
                    .catch(err => console.error("Error al cargar datos:", err));
            }, []);

            useEffect(() => {
                try {
                    localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
                } catch {
                    // Ignorar si el almacenamiento no está disponible
                }
            }, [cart]);

            if (!storeData) return <div className="min-h-screen flex items-center justify-center text-lg sm:text-xl font-semibold text-neutral-900 px-4 text-center">Cargando tienda ARENAS...</div>;

            const { settings, perfumes } = storeData;
            const defaultBrands = ['Todos', 'Lattafa', 'Rasasi', 'Afnan', 'Armaf', 'Al Haramain'];

            const filteredPerfumes = perfumes ? perfumes.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      p.desc.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesBrand = selectedBrand === 'Todos' || p.name.toLowerCase().includes(selectedBrand.toLowerCase());
                return matchesSearch && matchesBrand;
            }) : [];

            const addToCart = (perfume) => {
                const existing = cart.find(item => item.id === perfume.id);
                if (existing) {
                    setCart(cart.map(item => item.id === perfume.id ? { ...item, qty: item.qty + 1 } : item));
                } else {
                    setCart([...cart, { ...perfume, qty: 1 }]);
                }
            };

            const updateQty = (id, delta) => {
                setCart(cart.map(item => {
                    if (item.id === id) {
                        const newQty = item.qty + delta;
                        return newQty > 0 ? { ...item, qty: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const removeFromCart = (id) => {
                setCart(cart.filter(item => item.id !== id));
            };

            const clearCart = () => {
                setCart([]);
            };

            const getSubtotal = () => {
                return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            };

            const getTotalPrice = () => {
                return getSubtotal() + (cart.length > 0 ? SHIPPING_COST : 0);
            };

            const cleanName = customerName.trim() || 'Cliente Web';
            const cleanDistrict = customerDistrict.trim() || 'Por coordinar (Lima)';

            const buildPlainOrderText = () => {
                const orderDetails = cart.map(item => `• ${item.qty}x ${item.name} - S/ ${item.price * item.qty}.00`).join('\n');
                const subtotal = getSubtotal();
                const total = getTotalPrice();

                return (
                    `NOTA DE PEDIDO - ${settings.brandTitle}\n` +
                    `Cliente: ${cleanName}\n` +
                    `Distrito (Lima): ${cleanDistrict}\n` +
                    `Pago: Yape / Plin (${settings.yapeNumber})\n` +
                    `Productos:\n${orderDetails}\n` +
                    `Subtotal: S/ ${subtotal}.00\n` +
                    `Delivery Lima: S/ ${SHIPPING_COST}.00\n` +
                    `TOTAL A PAGAR: S/ ${total}.00`
                );
            };

            const buildWhatsAppUrl = () => {
                const orderDetails = cart.map(item => `▪️ ${item.qty}x ${item.name} - S/ ${item.price * item.qty}.00`).join('\n');
                const subtotal = getSubtotal();
                const total = getTotalPrice();

                const msg = encodeURIComponent(
                    `🧾 *NOTA DE PEDIDO - ${settings.brandTitle}* 🧾\n` +
                    `----------------------------------------\n` +
                    `👤 *Cliente:* ${cleanName}\n` +
                    `📍 *Distrito (Lima):* ${cleanDistrict}\n` +
                    `💳 *Pago:* Yape / Plin (${settings.yapeNumber})\n` +
                    `----------------------------------------\n` +
                    `🛍️ *DETALLE DE PRODUCTOS:*\n${orderDetails}\n` +
                    `----------------------------------------\n` +
                    `📦 *Subtotal:* S/ ${subtotal}.00\n` +
                    `🛵 *Delivery en Lima:* S/ ${SHIPPING_COST}.00\n` +
                    `💰 *TOTAL A PAGAR: S/ ${total}.00*\n` +
                    `----------------------------------------\n` +
                    `✨ Adjunto mi boleta en imagen. ¿Me confirman stock y entrega?`
                );

                return `https://wa.me/${settings.whatsapp}?text=${msg}`;
            };

            const handleCopyYape = async () => {
                try {
                    await navigator.clipboard.writeText(String(settings.yapeNumber));
                    setCopiedYape(true);
                    setTimeout(() => setCopiedYape(false), 2000);
                } catch {
                    setCopiedYape(false);
                }
            };

            const handleCopySummary = async () => {
                try {
                    await navigator.clipboard.writeText(buildPlainOrderText());
                    setCopiedSummary(true);
                    setTimeout(() => setCopiedSummary(false), 2000);
                } catch {
                    setCopiedSummary(false);
                }
            };

            const downloadReceiptImage = async () => {
                if (!receiptRef.current) return;
                try {
                    const canvas = await html2canvas(receiptRef.current, { backgroundColor: '#ffffff', scale: 2 });
                    const image = canvas.toDataURL("image/png");
                    const link = document.createElement('a');
                    link.href = image;
                    link.download = `Boleta_ARENAS_${Date.now()}.png`;
                    link.click();
                    setReceiptDownloaded(true);
                } catch (error) {
                    console.error("Error al generar imagen de boleta:", error);
                }
            };

            const renderCartContent = () => (
                <div className="bg-white border border-neutral-200 rounded-2xl p-4 sm:p-6 shadow-xl flex flex-col justify-between text-neutral-900">
                    <div>
                        <div className="flex justify-between items-center border-b border-neutral-200 pb-3 mb-4 gap-2">
                            <h3 className="text-lg sm:text-xl font-bold text-neutral-950 flex items-center space-x-2">
                                <i className="fas fa-shopping-bag"></i>
                                <span>Tu Pedido</span>
                            </h3>
                            <div className="flex items-center gap-2">
                                {cart.length > 0 && (
                                    <button
                                        type="button"
                                        onClick={clearCart}
                                        className="text-[11px] font-semibold text-neutral-600 hover:text-neutral-950 underline px-1.5 py-1"
                                    >
                                        Vaciar
                                    </button>
                                )}
                                <button 
                                    onClick={() => setIsCartOpen(false)} 
                                    className="text-neutral-600 hover:text-neutral-950 bg-neutral-100 border border-neutral-300 w-8 h-8 rounded-full flex items-center justify-center transition"
                                    title="Cerrar resumen"
                                >
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>
                        </div>

                        {cart.length === 0 ? (
                            <div className="text-center py-12 text-neutral-500">
                                <i className="fas fa-cart-arrow-down text-4xl mb-3 opacity-40"></i>
                                <p className="text-sm">Agrega productos para ver tu resumen aquí.</p>
                            </div>
                        ) : (
                            <>
                                <div className="space-y-3 max-h-[42vh] overflow-y-auto pr-1 mb-4">
                                    {cart.map(item => (
                                        <div key={item.id} className="bg-neutral-50 border border-neutral-200 p-2.5 sm:p-3 rounded-xl flex items-center justify-between gap-2 sm:gap-3">
                                            <img src={item.img} alt={item.name} className="w-11 h-11 sm:w-12 sm:h-12 object-cover rounded-lg border border-neutral-200 flex-shrink-0" />
                                            <div className="flex-grow min-w-0">
                                                <h4 className="text-neutral-950 font-bold text-xs truncate">{item.name}</h4>
                                                <p className="text-neutral-800 text-xs font-semibold mt-0.5">S/ {item.price * item.qty}.00</p>
                                            </div>
                                            <div className="flex items-center space-x-1.5 bg-white border border-neutral-300 rounded-lg px-2 py-0.5 flex-shrink-0">
                                                <button onClick={() => updateQty(item.id, -1)} className="text-neutral-600 hover:text-neutral-950 text-xs font-bold px-1">-</button>
                                                <span className="text-neutral-950 text-xs font-bold">{item.qty}</span>
                                                <button onClick={() => updateQty(item.id, 1)} className="text-neutral-600 hover:text-neutral-950 text-xs font-bold px-1">+</button>
                                            </div>
                                            <button onClick={() => removeFromCart(item.id)} className="text-neutral-500 hover:text-neutral-950 text-xs px-1 flex-shrink-0" title="Eliminar producto">
                                                <i className="fas fa-trash-alt"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-neutral-50 border border-neutral-200 rounded-xl p-3 mb-4 space-y-2.5">
                                    <p className="text-[11px] uppercase tracking-wider text-neutral-600 font-bold">Datos para entrega (opcional)</p>
                                    <input
                                        type="text"
                                        placeholder="Tu nombre (ej. Omar)"
                                        value={customerName}
                                        onChange={(e) => setCustomerName(e.target.value)}
                                        className="w-full bg-white border border-neutral-300 text-neutral-900 placeholder-neutral-400 px-3 py-2 rounded-lg text-xs focus:outline-none focus:border-neutral-950"
                                    />
                                    <input
                                        type="text"
                                        placeholder="Distrito en Lima (ej. San Miguel, Miraflores)"
                                        value={customerDistrict}
                                        onChange={(e) => setCustomerDistrict(e.target.value)}
                                        className="w-full bg-white border border-neutral-300 text-neutral-900 placeholder-neutral-400 px-3 py-2 rounded-lg text-xs focus:outline-none focus:border-neutral-950"
                                    />
                                </div>
                            </>
                        )}
                    </div>

                    {cart.length > 0 && (
                        <div className="border-t border-neutral-200 pt-4 space-y-2">
                            <div className="flex justify-between items-center text-xs text-neutral-600">
                                <span>Subtotal productos:</span>
                                <span>S/ {getSubtotal()}.00</span>
                            </div>
                            <div className="flex justify-between items-center text-xs text-neutral-600">
                                <span>Delivery en Lima:</span>
                                <span>S/ {SHIPPING_COST}.00</span>
                            </div>
                            <div className="flex justify-between items-center mb-3 pt-2 border-t border-neutral-200">
                                <span className="text-neutral-900 uppercase tracking-wider text-xs font-bold">Total a Pagar:</span>
                                <span className="text-neutral-950 text-xl sm:text-2xl font-extrabold">S/ {getTotalPrice()}.00</span>
                            </div>
                            <button 
                                onClick={() => { setReceiptDownloaded(false); setCopiedSummary(false); setShowReceiptModal(true); }}
                                className="w-full bg-neutral-950 hover:bg-neutral-800 text-white py-3.5 rounded-xl font-bold uppercase tracking-wider shadow-md flex items-center justify-center space-x-2 text-xs transition"
                            >
                                <span>Generar Boleta y Pedir</span>
                                <i className="fas fa-file-invoice-dollar text-base"></i>
                            </button>
                        </div>
                    )}
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col relative pb-24 bg-[#f8f8f8] text-neutral-900">
                    <header className="py-8 sm:py-12 px-4 sm:px-6 border-b border-neutral-200 text-center bg-white">
                        <h1 className="text-4xl sm:text-6xl font-black tracking-[0.16em] sm:tracking-[0.22em] text-neutral-950 mb-2 sm:mb-3 break-words">{settings.brandTitle}</h1>
                        <p className="text-xs sm:text-sm tracking-[0.18em] sm:tracking-[0.25em] text-neutral-600 uppercase">{settings.brandSubtitle}</p>
                        <div className="mt-5 inline-flex flex-wrap justify-center items-center border border-neutral-300 bg-neutral-50 px-4 sm:px-7 py-2.5 sm:py-3 rounded-2xl sm:rounded-full text-xs sm:text-sm gap-2 sm:gap-0">
                            <span className="text-neutral-800 font-medium"><i className="fas fa-motorcycle text-neutral-950 mr-2"></i>{settings.shippingText}</span>
                            <span className="hidden sm:inline mx-4 text-neutral-300">|</span>
                            <span className="text-neutral-800 font-medium"><i className="fas fa-mobile-alt text-neutral-950 mr-2"></i>Yape ({settings.yapeNumber})</span>
                            <button
                                type="button"
                                onClick={handleCopyYape}
                                className="sm:ml-3 px-2.5 py-1 rounded-full bg-neutral-950 hover:bg-neutral-800 text-white text-[11px] font-semibold transition"
                            >
                                <i className={`fas ${copiedYape ? 'fa-check' : 'fa-copy'} mr-1`}></i>
                                {copiedYape ? 'Copiado' : 'Copiar'}
                            </button>
                        </div>

                        {/* SECCIÓN DE CONFIANZA */}
                        <div className="mt-6 sm:mt-8 grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-4 max-w-4xl mx-auto">
                            <div className="bg-neutral-50 border border-neutral-200 rounded-xl p-3.5 sm:p-4 flex items-center space-x-3 sm:space-x-4">
                                <div className="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-neutral-950 flex items-center justify-center text-white text-base sm:text-lg flex-shrink-0">
                                    <i className="fas fa-shield-alt"></i>
                                </div>
                                <div className="text-left">
                                    <h4 className="text-neutral-950 font-bold text-xs sm:text-sm">100% Originales</h4>
                                    <p className="text-neutral-600 text-[11px] sm:text-xs">Garantía en perfumes árabes</p>
                                </div>
                            </div>
                            <div className="bg-neutral-50 border border-neutral-200 rounded-xl p-3.5 sm:p-4 flex items-center space-x-3 sm:space-x-4">
                                <div className="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-neutral-950 flex items-center justify-center text-white text-base sm:text-lg flex-shrink-0">
                                    <i className="fas fa-wallet"></i>
                                </div>
                                <div className="text-left">
                                    <h4 className="text-neutral-950 font-bold text-xs sm:text-sm">Yape / Plin Aceptado</h4>
                                    <p className="text-neutral-600 text-[11px] sm:text-xs">Pagos rápidos ({settings.yapeNumber})</p>
                                </div>
                            </div>
                            <div className="bg-neutral-50 border border-neutral-200 rounded-xl p-3.5 sm:p-4 flex items-center space-x-3 sm:space-x-4">
                                <div className="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-neutral-950 flex items-center justify-center text-white text-base sm:text-lg flex-shrink-0">
                                    <i className="fas fa-motorcycle"></i>
                                </div>
                                <div className="text-left">
                                    <h4 className="text-neutral-950 font-bold text-xs sm:text-sm">Delivery en Lima</h4>
                                    <p className="text-neutral-600 text-[11px] sm:text-xs">Entregas seguras (S/ {SHIPPING_COST}.00)</p>
                                </div>
                            </div>
                        </div>

                        {/* BARRA DE BÚSQUEDA */}
                        <div className="mt-6 sm:mt-8 max-w-md mx-auto relative">
                            <span className="absolute inset-y-0 left-4 flex items-center text-neutral-500">
                                <i className="fas fa-search"></i>
                            </span>
                            <input 
                                type="text" 
                                placeholder="Busca tu perfume árabe (ej. Khamrah, Asad...)" 
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full bg-neutral-50 border border-neutral-300 text-neutral-950 placeholder-neutral-400 pl-11 pr-16 py-3 rounded-full focus:outline-none focus:border-neutral-950 transition text-xs sm:text-sm"
                            />
                            {searchTerm && (
                                <button onClick={() => setSearchTerm('')} className="absolute inset-y-0 right-4 flex items-center text-neutral-600 hover:text-neutral-950 text-[11px] font-bold uppercase tracking-wider">
                                    Limpiar
                                </button>
                            )}
                        </div>

                        {/* FILTROS POR MARCA */}
                        <div className="mt-5 sm:mt-6 flex flex-wrap justify-center gap-2 max-w-2
