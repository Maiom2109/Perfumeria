<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENAS | Perfumería Exclusiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0a0a; color: #f5f5f5; font-family: 'Didot', 'Georgia', serif; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #0a0a0a; }
        .card:hover { transform: translateY(-5px); transition: all 0.3s ease; border-color: #d4af37; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [perfumes, setPerfumes] = useState([]);
            const [loading, setLoading] = useState(true);

            // Conexión con el Backend para obtener la base de datos
            useEffect(() => {
                fetch('/api/perfumes')
                    .then(res => res.json())
                    .then(data => {
                        setPerfumes(data);
                        setLoading(false);
                    })
                    .catch(err => console.error("Error conectando al backend:", err));
            }, []);

            const buyProduct = (name) => {
                const msg = encodeURIComponent(`Hola ARENAS, deseo adquirir el perfume ${name}. ¿Tienen stock disponible para envío a Lima? Mi método de pago es Yape.`);
                window.open(`https://wa.me/51940637153?text=${msg}`, '_blank');
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center text-2xl gold-text">Cargando catálogo...</div>;

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="p-8 border-b border-gray-800 text-center relative">
                        <h1 className="text-5xl font-bold tracking-[0.2em] gold-text mb-2">ARENAS</h1>
                        <p className="text-sm tracking-widest text-gray-400">PERFUMERÍA EXCLUSIVA</p>
                        <div className="mt-6 inline-block border border-gray-700 px-6 py-2 rounded-full text-sm">
                            <span className="text-white"><i className="fas fa-motorcycle text-gray-400 mr-2"></i>Envíos a todo Lima</span>
                            <span className="mx-4 text-gray-600">|</span>
                            <span className="text-white"><i className="fas fa-mobile-alt text-gray-400 mr-2"></i>Pago por Yape (940637153)</span>
                        </div>
                    </header>

                    <main className="flex-grow p-8 max-w-7xl mx-auto w-full">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                            {perfumes.map(p => (
                                <div key={p.id} className="card bg-[#111] border border-gray-800 rounded-xl overflow-hidden flex flex-col">
                                    <div className="h-64 overflow-hidden relative">
                                        <div className="absolute inset-0 bg-black bg-opacity-20 z-10"></div>
                                        <img src={p.img} alt={p.name} className="w-full h-full object-cover grayscale hover:grayscale-0 transition duration-700" />
                                    </div>
                                    <div className="p-6 flex-grow flex flex-col justify-between">
                                        <div>
                                            <h3 className="text-xl font-bold mb-1">{p.name}</h3>
                                            <p className="text-gray-400 text-sm mb-4">{p.desc}</p>
                                        </div>
                                        <div>
                                            <p className="gold-text text-2xl mb-6">S/ {p.price}.00</p>
                                            <button onClick={() => buyProduct(p.name)} className="w-full gold-bg py-3 rounded uppercase tracking-wider font-bold hover:bg-yellow-600 transition text-sm">
                                                Comprar ahora <i className="fab fa-whatsapp ml-2"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    <footer className="p-10 border-t border-gray-800 text-center text-gray-500 text-sm">
                        <p>&copy; 2026 ARENAS. Todos los derechos reservados.</p>
                        <a href="/admin.html" className="mt-4 inline-block text-gray-700 hover:text-gray-400"><i className="fas fa-cog"></i> Acceso Admin</a>
                    </footer>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
