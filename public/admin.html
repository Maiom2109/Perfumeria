<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración Total - ARENAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0b0b; color: #f5f5f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #0a0a0a; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const AdminApp = () => {
            const [auth, setAuth] = useState(false);
            const [password, setPassword] = useState('');
            const [storeData, setStoreData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === 'arenas2026') {
                    setAuth(true);
                    fetchData();
                } else {
                    alert('Contraseña incorrecta');
                }
            };

            const fetchData = () => {
                fetch('/api/data')
                    .then(res => res.json())
                    .then(data => setStoreData(data))
                    .catch(err => alert('Error al cargar los datos del servidor'));
            };

            const saveData = () => {
                setLoading(true);
                setMessage('');
                fetch('/api/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, data: storeData })
                })
                .then(res => res.json())
                .then(response => {
                    setLoading(false);
                    if (response.success) {
                        setMessage('¡Guardado y sincronizado en GitHub con éxito!');
                    } else {
                        setMessage('Error: ' + (response.error || 'No se pudo guardar'));
                    }
                })
                .catch(err => {
                    setLoading(false);
                    setMessage('Error de conexión con el servidor.');
                });
            };

            const handleSettingChange = (field, value) => {
                setStoreData({
                    ...storeData,
                    settings: { ...storeData.settings, [field]: value }
                });
            };

            const handlePerfumeChange = (index, field, value) => {
                const newPerfumes = [...storeData.perfumes];
                newPerfumes[index][field] = value;
                setStoreData({ ...storeData, perfumes: newPerfumes });
            };

            const addPerfume = () => {
                const newPerfume = {
                    id: Date.now().toString(),
                    name: "Nuevo Perfume",
                    price: 150,
                    desc: "Descripción del perfume árabe",
                    img: "https://images.unsplash.com/photo-1523293182086-7651a899d37f"
                };
                setStoreData({
                    ...storeData,
                    perfumes: [...storeData.perfumes, newPerfume]
                });
            };

            const deletePerfume = (id) => {
                const newPerfumes = storeData.perfumes.filter(p => p.id !== id);
                setStoreData({ ...storeData, perfumes: newPerfumes });
            };

            if (!auth) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <form onSubmit={handleLogin} className="bg-[#141414] border border-gray-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center">
                            <h2 className="text-3xl font-bold gold-text mb-6">ARENAS Admin</h2>
                            <p className="text-gray-400 text-sm mb-6">Ingresa tu contraseña para controlar toda la tienda.</p>
                            <input 
                                type="password" 
                                placeholder="Contraseña" 
                                value={password} 
                                onChange={e => setPassword(e.target.value)}
                                className="w-full bg-black border border-gray-700 rounded-xl px-4 py-3 text-white mb-6 focus:outline-none focus:border-yellow-500"
                            />
                            <button type="submit" className="w-full gold-bg font-bold py-3 rounded-xl uppercase tracking-widest hover:bg-yellow-500 transition">
                                Ingresar al Panel
                            </button>
                        </form>
                    </div>
                );
            }

            if (!storeData) return <div className="min-h-screen flex items-center justify-center text-xl gold-text">Cargando panel...</div>;

            return (
                <div className="min-h-screen p-6 md:p-12 max-w-6xl mx-auto">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-10 border-b border-gray-800 pb-6">
                        <div>
                            <h1 className="text-4xl font-extrabold gold-text">Panel de Control Total</h1>
                            <p className="text-gray-400 text-sm mt-1">Modifica textos, números, precios y catálogo sincronizado en GitHub.</p>
                        </div>
                        <div className="mt-4 md:mt-0 flex items-center space-x-4">
                            {message && <span className="text-sm text-yellow-400 bg-black/60 px-4 py-2 rounded-lg border border-yellow-600/30">{message}</span>}
                            <button 
                                onClick={saveData} 
                                disabled={loading}
                                className="gold-bg px-8 py-3 rounded-xl font-bold uppercase tracking-widest hover:bg-yellow-500 transition shadow-lg disabled:opacity-50"
                            >
                                {loading ? 'Guardando...' : 'Guardar Todo'}
                            </button>
                        </div>
                    </div>

                    {/* CONFIGURACIÓN GENERAL EDITABLE */}
                    <div className="bg-[#121212] border border-gray-800 p-6 rounded-2xl mb-10 shadow-xl">
                        <h3 className="text-xl font-bold mb-4 text-white"><i className="fas fa-sliders-h gold-text mr-2"></i> Textos y Configuración General</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label className="block text-xs uppercase tracking-widest text-gray-400 mb-2">Título de la Tienda (Brand Title)</label>
                                <input 
                                    type="text" 
                                    value={storeData.settings.brandTitle} 
                                    onChange={e => handleSettingChange('brandTitle', e.target.value)}
                                    className="w-full bg-black border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm"
                                />
                            </div>
                            <div>
                                <label className="block text-xs uppercase tracking-widest text-gray-400 mb-2">Subtítulo (Brand Subtitle)</label>
                                <input 
                                    type="text" 
                                    value={storeData.settings.brandSubtitle} 
                                    onChange={e => handleSettingChange('brandSubtitle', e.target.value)}
                                    className="w-full bg-black border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm"
                                />
                            </div>
                            <div>
                                <label className="block text-xs uppercase tracking-widest text-gray-400 mb-2">Texto de Envío (Barra Superior)</label>
                                <input 
                                    type="text" 
                                    value={storeData.settings.shippingText} 
                                    onChange={e => handleSettingChange('shippingText', e.target.value)}
                                    className="w-full bg-black border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm"
                                />
                            </div>
                            <div>
                                <label className="block text-xs uppercase tracking-widest text-gray-400 mb-2">Número de WhatsApp (Sin signo +)</label>
                                <input 
                                    type="text" 
                                    value={storeData.settings.whatsapp} 
                                    onChange={e => handleSettingChange('whatsapp', e.target.value)}
                                    className="w-full bg-black border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm"
                                />
                            </div>
                            <div className="md:col-span-2">
                                <label className="block text-xs uppercase tracking-widest text-gray-400 mb-2">Número de Yape / Plin</label>
                                <input 
                                    type="text" 
                                    value={storeData.settings.yapeNumber} 
                                    onChange={e => handleSettingChange('yapeNumber', e.target.value)}
                                    className="w-full bg-black border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm"
                                />
                            </div>
                        </div>
                    </div>

                    {/* CATÁLOGO DE PERFUMES */}
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="text-2xl font-bold text-white"><i className="fas fa-wine-bottle gold-text mr-2"></i> Catálogo de Perfumes</h3>
                        <button onClick={addPerfume} className="bg-green-600 hover:bg-green-500 text-white px-5 py-2.5 rounded-xl font-bold text-sm transition shadow-md">
                            <i className="fas fa-plus mr-2"></i> Agregar Perfume
                        </button>
                    </div>

                    <div className="grid grid-cols-1 gap-6">
                        {storeData.perfumes.map((p, index) => (
                            <div key={p.id} className="bg-[#121212] border border-gray-800 p-6 rounded-2xl flex flex-col md:flex-row gap-6 items-center shadow-xl">
                                <img src={p.img} alt={p.name} className="w-28 h-28 object-cover rounded-xl border border-gray-700 bg-black flex-shrink-0" />
                                <div className="flex-grow grid grid-cols-1 md:grid-cols-3 gap-4 w-full">
                                    <div>
                                        <label className="block text-xs uppercase tracking-widest text-gray-400 mb-1">Nombre</label>
                                        <input 
                                            type="text" 
                                            value={p.name} 
                                            onChange={e => handlePerfumeChange(index, 'name', e.target.value)}
                                            className="w-full bg-black border border-gray-700 rounded-xl px-3 py-2 text-white text-sm"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase tracking-widest text-gray-400 mb-1">Precio (S/)</label>
                                        <input 
                                            type="number" 
                                            value={p.price} 
                                            onChange={e => handlePerfumeChange(index, 'price', Number(e.target.value))}
                                            className="w-full bg-black border border-gray-700 rounded-xl px-3 py-2 text-white text-sm"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase tracking-widest text-gray-400 mb-1">URL de la Imagen</label>
                                        <input 
                                            type="text" 
                                            value={p.img} 
                                            onChange={e => handlePerfumeChange(index, 'img', e.target.value)}
                                            className="w-full bg-black border border-gray-700 rounded-xl px-3 py-2 text-white text-sm"
                                        />
                                    </div>
                                    <div className="md:col-span-3">
                                        <label className="block text-xs uppercase tracking-widest text-gray-400 mb-1">Descripción</label>
                                        <input 
                                            type="text" 
                                            value={p.desc} 
                                            onChange={e => handlePerfumeChange(index, 'desc', e.target.value)}
                                            className="w-full bg-black border border-gray-700 rounded-xl px-3 py-2 text-white text-sm"
                                        />
                                    </div>
                                </div>
                                <button onClick={() => deletePerfume(p.id)} className="text-red-500 hover:text-red-400 p-3 transition" title="Eliminar perfume">
                                    <i className="fas fa-trash-alt text-lg"></i>
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
