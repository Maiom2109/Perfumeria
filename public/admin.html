<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Administración | ARENAS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    html, body {
      background-color: #09090b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const EMPTY_SETTINGS = {
      brandTitle: '',
      brandSubtitle: '',
      shippingText: '',
      yapeNumber: '',
      whatsapp: ''
    };

    const EMPTY_FORM = {
      id: null,
      name: '',
      desc: '',
      price: '0',
      img: '',
      active: true
    };

    function isGoogleImageUrl(url) {
      const clean = String(url || '').toLowerCase();
      return clean.includes('google.') || clean.includes('gstatic.');
    }

    function isValidHttpsUrl(url) {
      const clean = String(url || '').trim();
      if (!clean || clean.length > 500) return false;
      try {
        const parsed = new URL(clean);
        return parsed.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function validateSettingsForm(settings) {
      const errors = {};
      const title = (settings.brandTitle || '').trim();
      const subtitle = (settings.brandSubtitle || '').trim();
      const shipping = (settings.shippingText || '').trim();
      const yape = (settings.yapeNumber || '').trim();
      const whatsapp = (settings.whatsapp || '').trim();

      if (title.length < 1 || title.length > 40) {
        errors.brandTitle = 'Debe tener entre 1 y 40 caracteres.';
      }
      if (subtitle.length < 1 || subtitle.length > 60) {
        errors.brandSubtitle = 'Debe tener entre 1 y 60 caracteres.';
      }
      if (shipping.length < 1 || shipping.length > 80) {
        errors.shippingText = 'Debe tener entre 1 y 80 caracteres.';
      }
      if (!/^9\d{8}$/.test(yape)) {
        errors.yapeNumber = 'Debe tener 9 dígitos y empezar con 9.';
      }
      if (!/^51\d{9}$/.test(whatsapp)) {
        errors.whatsapp = 'Debe empezar con 51 y tener 11 dígitos en total.';
      }
      return errors;
    }

    function AdminApp() {
      const [checkingSession, setCheckingSession] = useState(true);
      const [authenticated, setAuthenticated] = useState(false);

      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [loggingIn, setLoggingIn] = useState(false);

      const [loadingData, setLoadingData] = useState(false);
      const [saving, setSaving] = useState(false);
      const [dirty, setDirty] = useState(false);
      const [toast, setToast] = useState(null);

      const [settings, setSettings] = useState(EMPTY_SETTINGS);
      const [perfumes, setPerfumes] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');

      const [modalOpen, setModalOpen] = useState(false);
      const [formState, setFormState] = useState(EMPTY_FORM);
      const [formError, setFormError] = useState('');

      const [deleteTarget, setDeleteTarget] = useState(null);

      function showToast(message) {
        setToast(message);
      }

      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 3200);
        return () => clearTimeout(timer);
      }, [toast]);

      useEffect(() => {
        function handleBeforeUnload(e) {
          if (!dirty) return;
          e.preventDefault();
          e.returnValue = '';
        }
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [dirty]);

      async function loadAdminData() {
        setLoadingData(true);
        try {
          const res = await fetch('/api/admin/data', { credentials: 'include' });
          const body = await res.json();
          if (!res.ok) {
            throw new Error(body.error || 'No se pudieron cargar los datos.');
          }
          setSettings({
            brandTitle: body.settings && body.settings.brandTitle ? body.settings.brandTitle : '',
            brandSubtitle: body.settings && body.settings.brandSubtitle ? body.settings.brandSubtitle : '',
            shippingText: body.settings && body.settings.shippingText ? body.settings.shippingText : '',
            yapeNumber: body.settings && body.settings.yapeNumber ? body.settings.yapeNumber : '',
            whatsapp: body.settings && body.settings.whatsapp ? body.settings.whatsapp : ''
          });
          setPerfumes(
            Array.isArray(body.perfumes)
              ? body.perfumes.map((p) => ({
                  id: p.id,
                  name: p.name || '',
                  desc: p.desc || '',
                  price: Number.isInteger(Number(p.price)) ? Number(p.price) : 0,
                  img: p.img || '',
                  active: p.active !== false
                }))
              : []
          );
          setDirty(false);
        } catch (err) {
          showToast(err.message || 'Error al cargar datos.');
        } finally {
          setLoadingData(false);
        }
      }

      useEffect(() => {
        let active = true;
        fetch('/api/admin/me', { credentials: 'include' })
          .then((r) => r.json())
          .then((data) => {
            if (!active) return;
            if (data && data.authenticated) {
              setAuthenticated(true);
              loadAdminData();
            } else {
              setAuthenticated(false);
            }
          })
          .catch(() => {
            if (active) setAuthenticated(false);
          })
          .finally(() => {
            if (active) setCheckingSession(false);
          });
        return () => { active = false; };
      }, []);

      async function handleLoginSubmit(e) {
        e.preventDefault();
        setLoginError('');
        if (!passwordInput.trim()) {
          setLoginError('Ingresa la contraseña.');
          return;
        }
        setLoggingIn(true);
        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ password: passwordInput })
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || 'Error al iniciar sesión.');
          }
          setPasswordInput('');
          setAuthenticated(true);
          await loadAdminData();
        } catch (err) {
          setLoginError(err.message || 'Credenciales inválidas.');
        } finally {
          setLoggingIn(false);
        }
      }

      async function handleLogout() {
        try {
          await fetch('/api/admin/logout', {
            method: 'POST',
            credentials: 'include'
          });
        } finally {
          setAuthenticated(false);
          setDirty(false);
          setPerfumes([]);
          setSettings(EMPTY_SETTINGS);
        }
      }

      function handleSettingChange(field, value) {
        setSettings((prev) => ({
          ...prev,
          [field]: value
        }));
        setDirty(true);
      }

      function openCreateModal() {
        setFormError('');
        setFormState({
          id: null,
          name: '',
          desc: '',
          price: '0',
          img: '',
          active: true
        });
        setModalOpen(true);
      }

      function openEditModal(perfume) {
        setFormError('');
        setFormState({
          id: perfume.id,
          name: perfume.name || '',
          desc: perfume.desc || '',
          price: String(Number.isInteger(Number(perfume.price)) ? Number(perfume.price) : 0),
          img: perfume.img || '',
          active: perfume.active !== false
        });
        setModalOpen(true);
      }

      function handleDuplicatePerfume(perfume) {
        setPerfumes((prev) => {
          const copyItem = {
            id: null,
            name: `${perfume.name} (Copia)`.slice(0, 80),
            desc: (perfume.desc || '').slice(0, 300),
            price: Number.isInteger(Number(perfume.price)) ? Number(perfume.price) : 0,
            img: perfume.img || '',
            active: perfume.active !== false
          };
          return prev.concat([copyItem]);
        });
        setDirty(true);
        showToast('Perfume duplicado. Revisa el formato y guarda cambios.');
      }

      function handleToggleActive(index) {
        setPerfumes((prev) =>
          prev.map((item, idx) =>
            idx === index ? { ...item, active: item.active === false } : item
          )
        );
        setDirty(true);
      }

      function handleMovePerfume(index, direction) {
        setPerfumes((prev) => {
          const targetIndex = index + direction;
          if (targetIndex < 0 || targetIndex >= prev.length) return prev;
          const next = prev.slice();
          const temp = next[index];
          next[index] = next[targetIndex];
          next[targetIndex] = temp;
          return next;
        });
        setDirty(true);
      }

      function confirmDeletePerfume() {
        if (!deleteTarget) return;
        const idxToRemove = deleteTarget.index;
        setPerfumes((prev) => prev.filter((_, idx) => idx !== idxToRemove));
        setDeleteTarget(null);
        setDirty(true);
        showToast('Perfume eliminado de la lista. Guarda cambios para aplicar.');
      }

      function handlePriceInputChange(rawVal) {
        const digitsOnly = String(rawVal || '').replace(/[^\d]/g, '');
        setFormState((prev) => ({
          ...prev,
          price: digitsOnly
        }));
      }

      function handleSaveModal(e) {
        e.preventDefault();
        setFormError('');

        const cleanName = (formState.name || '').trim();
        const cleanDesc = (formState.desc || '').trim();
        const cleanImg = (formState.img || '').trim();
        const parsedPrice = formState.price === '' ? NaN : Number(formState.price);

        if (cleanName.length < 1 || cleanName.length > 80) {
          setFormError('El nombre debe tener entre 1 y 80 caracteres.');
          return;
        }
        if (cleanDesc.length > 300) {
          setFormError('La descripción no puede superar los 300 caracteres.');
          return;
        }
        if (!Number.isInteger(parsedPrice) || parsedPrice < 0 || parsedPrice > 5000) {
          setFormError('El precio debe ser un número entero entre 0 y 5000.');
          return;
        }
        if (!isValidHttpsUrl(cleanImg)) {
          setFormError('Ingresa una URL válida que comience con https:// (máx. 500 caracteres).');
          return;
        }

        const nextPerfume = {
          id: formState.id,
          name: cleanName,
          desc: cleanDesc,
          price: parsedPrice,
          img: cleanImg,
          active: Boolean(formState.active)
        };

        setPerfumes((prev) => {
          if (formState.id !== null && formState.id !== undefined) {
            return prev.map((item) => (item.id === formState.id ? nextPerfume : item));
          }
          return prev.concat([nextPerfume]);
        });

        setDirty(true);
        setModalOpen(false);
        showToast('Cambios aplicados en el borrador. Pulsa Guardar cambios.');
      }

      async function handleSaveAll() {
        const settingErrors = validateSettingsForm(settings);
        if (Object.keys(settingErrors).length > 0) {
          showToast('Revisa los campos de configuración antes de guardar.');
          return;
        }

        setSaving(true);
        try {
          const payload = {
            settings: {
              brandTitle: settings.brandTitle.trim(),
              brandSubtitle: settings.brandSubtitle.trim(),
              shippingText: settings.shippingText.trim(),
              yapeNumber: settings.yapeNumber.trim(),
              whatsapp: settings.whatsapp.trim()
            },
            perfumes: perfumes.map((p) => ({
              id: p.id,
              name: (p.name || '').trim(),
              desc: (p.desc || '').trim(),
              price: Number.isInteger(Number(p.price)) ? Number(p.price) : 0,
              img: (p.img || '').trim(),
              active: p.active !== false
            }))
          };

          const res = await fetch('/api/admin/data', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || 'Error al guardar en GitHub.');
          }

          setSettings(data.settings);
          setPerfumes(data.perfumes);
          setDirty(false);
          showToast('Cambios guardados correctamente.');
        } catch (err) {
          showToast(err.message || 'No se pudieron guardar los cambios.');
        } finally {
          setSaving(false);
        }
      }

      const settingErrors = useMemo(() => validateSettingsForm(settings), [settings]);

      const filteredEntries = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return perfumes
          .map((perfume, index) => ({ perfume, index }))
          .filter(({ perfume }) => {
            if (!q) return true;
            const n = (perfume.name || '').toLowerCase();
            const d = (perfume.desc || '').toLowerCase();
            return n.includes(q) || d.includes(q);
          });
      }, [perfumes, searchQuery]);

      if (checkingSession) {
        return (
          <div className="min-h-screen bg-zinc-950 text-white flex items-center justify-center p-4">
            <p className="text-sm text-zinc-300">Verificando sesión...</p>
          </div>
        );
      }

      if (!authenticated) {
        return (
          <div className="min-h-screen bg-zinc-950 text-white flex items-center justify-center p-4">
            <div className="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-xl p-6">
              <div className="mb-6">
                <p className="text-xs uppercase tracking-widest text-zinc-400">ARENAS</p>
                <h1 className="text-2xl font-bold text-white mt-1">Panel de Administración</h1>
              </div>

              <form onSubmit={handleLoginSubmit} className="space-y-4">
                <div>
                  <label htmlFor="admin-password" className="block text-xs uppercase tracking-wider text-zinc-300 mb-2">
                    Contraseña
                  </label>
                  <input
                    id="admin-password"
                    type="password"
                    autoComplete="current-password"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    className="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-white"
                    placeholder="Ingresa tu contraseña"
                  />
                </div>

                {loginError && (
                  <p className="text-xs text-zinc-200 bg-zinc-950 border border-white rounded-lg p-3">
                    {loginError}
                  </p>
                )}

                <button
                  type="submit"
                  disabled={loggingIn}
                  className="w-full bg-white text-black font-bold text-xs uppercase tracking-wider py-3 rounded-lg hover:bg-zinc-200 disabled:opacity-50 transition"
                >
                  {loggingIn ? 'Ingresando...' : 'Iniciar sesión'}
                </button>
              </form>

              <div className="mt-5 pt-4 border-t border-zinc-800 flex justify-between items-center text-xs">
                <a href="/" className="text-zinc-300 hover:text-white underline">
                  Ver tienda
                </a>
              </div>
            </div>
          </div>
        );
      }

      const safePreviewPrice = formState.price === '' ? 0 : Number(formState.price);

      return (
        <div className="min-h-screen bg-zinc-950 text-white pb-28">
          <header className="bg-black border-b border-zinc-800 sticky top-0 z-20">
            <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
              <div>
                <p className="text-[11px] uppercase tracking-widest text-zinc-400">ARENAS · Panel</p>
                <h1 className="text-xl font-bold text-white">Administración de Tienda</h1>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                {dirty && (
                  <span className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-zinc-900 border border-white text-white">
                    Cambios sin guardar
                  </span>
                )}
                <a
                  href="/"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition"
                >
                  Ver tienda
                </a>
                <button
                  type="button"
                  onClick={handleLogout}
                  className="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition"
                >
                  Cerrar sesión
                </button>
              </div>
            </div>
          </header>

          {toast && (
            <div className="fixed top-20 right-4 z-50 max-w-sm bg-black border border-white text-white text-xs font-semibold px-4 py-3 rounded-lg shadow-xl">
              {toast}
            </div>
          )}

          <main className="max-w-6xl mx-auto px-4 py-6 space-y-8">
            {loadingData ? (
              <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-8 text-center text-sm text-zinc-300">
                Cargando catálogo y configuración...
              </div>
            ) : (
              <>
                <section className="bg-zinc-900 border border-zinc-800 rounded-xl p-4 sm:p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
                    <div>
                      <h2 className="text-lg font-bold text-white">Perfumes y decants ({perfumes.length}/200)</h2>
                      <p className="text-xs text-zinc-400 mt-0.5">
                        El orden de la lista define cómo se muestran en la tienda.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={openCreateModal}
                      className="w-full sm:w-auto bg-white text-black hover:bg-zinc-200 text-xs font-bold uppercase tracking-wider px-4 py-2.5 rounded-lg transition"
                    >
                      <i className="fas fa-plus mr-1.5"></i>Nuevo perfume
                    </button>
                  </div>

                  <div className="mb-5">
                    <label htmlFor="search-perfumes" className="sr-only">Buscar perfumes</label>
                    <input
                      id="search-perfumes"
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Buscar por nombre o descripción..."
                      className="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-white"
                    />
                  </div>

                  {filteredEntries.length === 0 ? (
                    <div className="bg-zinc-950 border border-zinc-800 rounded-lg p-6 text-center text-xs text-zinc-400">
                      No hay perfumes que coincidan con el filtro.
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {filteredEntries.map(({ perfume, index }) => {
                        const isActive = perfume.active !== false;
                        return (
                          <div
                            key={`${perfume.id ?? 'new'}-${index}`}
                            className="bg-zinc-950 border border-zinc-800 rounded-xl p-3.5 flex flex-col md:flex-row md:items-center justify-between gap-4"
                          >
                            <div className="flex items-start sm:items-center gap-3.5 min-w-0">
                              <img
                                src={perfume.img}
                                alt={perfume.name}
                                className="w-16 h-16 rounded-lg object-cover border border-zinc-800 bg-black flex-shrink-0"
                              />
                              <div className="min-w-0">
                                <div className="flex flex-wrap items-center gap-2">
                                  <h3 className="text-sm font-bold text-white truncate">{perfume.name}</h3>
                                  <span className="text-[11px] uppercase tracking-wider px-2 py-0.5 rounded border border-zinc-700 bg-zinc-900 text-zinc-200">
                                    {isActive ? 'Activo' : 'Oculto'}
                                  </span>
                                </div>
                                <p className="text-xs text-zinc-400 mt-1 line-clamp-2">{perfume.desc}</p>
                                <p className="text-sm font-bold text-white mt-1">S/ {perfume.price}</p>
                              </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2 md:justify-end flex-shrink-0">
                              <button
                                type="button"
                                disabled={index === 0}
                                onClick={() => handleMovePerfume(index, -1)}
                                title="Subir"
                                aria-label="Subir"
                                className="bg-zinc-800 hover:bg-zinc-700 disabled:opacity-40 border border-zinc-700 text-white text-xs px-2.5 py-2 rounded-lg transition"
                              >
                                <i className="fas fa-arrow-up"></i>
                              </button>
                              <button
                                type="button"
                                disabled={index === perfumes.length - 1}
                                onClick={() => handleMovePerfume(index, 1)}
                                title="Bajar"
                                aria-label="Bajar"
                                className="bg-zinc-800 hover:bg-zinc-700 disabled:opacity-40 border border-zinc-700 text-white text-xs px-2.5 py-2 rounded-lg transition"
                              >
                                <i className="fas fa-arrow-down"></i>
                              </button>
                              <button
                                type="button"
                                onClick={() => handleToggleActive(index)}
                                className="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white text-xs font-semibold px-3 py-2 rounded-lg transition"
                              >
                                {isActive ? 'Ocultar' : 'Activar'}
                              </button>
                              <button
                                type="button"
                                onClick={() => handleDuplicatePerfume(perfume)}
                                className="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white text-xs font-semibold px-3 py-2 rounded-lg transition"
                              >
                                Duplicar
                              </button>
                              <button
                                type="button"
                                onClick={() => openEditModal(perfume)}
                                className="bg-white hover:bg-zinc-200 text-black text-xs font-bold px-3 py-2 rounded-lg transition"
                              >
                                Editar
                              </button>
                              <button
                                type="button"
                                onClick={() => setDeleteTarget({ index, name: perfume.name })}
                                className="bg-zinc-950 hover:bg-zinc-900 border border-white text-white text-xs font-semibold px-3 py-2 rounded-lg transition"
                              >
                                Eliminar
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </section>

                <section className="bg-zinc-900 border border-zinc-800 rounded-xl p-4 sm:p-6">
                  <h2 className="text-lg font-bold text-white mb-4">Configuración de la tienda</h2>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs uppercase tracking-wider text-zinc-300 mb-1.5">
                        Título de marca (1-40)
                      </label>
                      <input
                        type="text"
                        maxLength={40}
                        value={settings.brandTitle}
                        onChange={(e) => handleSettingChange('brandTitle', e.target.value)}
                        className="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-white"
                      />
                      {settingErrors.brandTitle && (
                        <p className="text-xs text-zinc-300 mt-1">{settingErrors.brandTitle}</p>
                      )}
                    </div>

                    <div>
                      <label className="block text-xs uppercase tracking-wider text-zinc-300 mb-1.5">
                        Subtítulo (1-60)
                      </label>
                      <input
                        type="text"
                        maxLength={60}
                        value={settings.brandSubtitle}
                        onChange={(e) => handleSettingChange('brandSubtitle', e.target.value)}
                        className="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-white"
                      />
                      {settingErrors.brandSubtitle && (
                        <p className="text-xs text-zinc-300 mt-1">{settingErrors.brandSubtitle}</p>
                      )}
                    </div>

                    <div className="md:col-span-2">
                      <label className="block text-xs uppercase tracking-wider text-zinc-300 mb-1.5">
                        Texto de envío (1-80)
                      </label>
                      <input
                        type="text"
                        maxLength={80}
                        value={settings.shippingText}
                        onChange={(e) => handleSettingChange('shippingText', e.target.value)}
                        className="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-white"
                      />
                      {settingErrors.shippingText && (
                        <p className="text-xs text-zinc-300 mt-1">{settingErrors.shippingText}</p>
                      )}
                    </div>

                    <div>
                      <label className="block text-xs uppercase tracking-wider text-zinc-300 mb-1.5">
                        Número Yape (9 dígitos, inicia con 9)
                      </label>
                      <input
                        type="text"
                        maxLength={9}
                        value={settings.yapeNumber}
                        onChange={(e) => handleSettingChange('yapeNumber', e.target.value.replace(/[^\d]/g, ''))}
                        className="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-white"
                      />
                      {settingErrors.yapeNumber && (
                        <p className="text-xs text-zinc-300 mt-1">{settingErrors.yapeNumber}</p>
                      )}
                    </div>

                    <div>
                      <label className="block text-xs uppercase tracking-wider text-zinc-300 mb-1.5">
                        WhatsApp (formato 519XXXXXXXX)
                      </label>
                      <input
                        type="text"
                        maxLength={11}
                        value={settings.whatsapp}
                        onChange={(e) => handleSettingChange('whatsapp', e.target.value.replace(/[^\d]/g, ''))}
                        className="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-white"
                      />
                      {settingErrors.whatsapp && (
                        <p className="text-xs text-zinc-300 mt-1">{settingErrors.whatsapp}</p>
                      )}
                    </div>
                  </div>
                </section>
              </>
            )}
          </main>

          <div className="fixed bottom-0 inset-x-0 bg-black border-t border-zinc-800 z-30">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
              <span className="text-xs text-zinc-300">
                {dirty ? 'Tienes cambios sin guardar' : 'Todo sincronizado'}
              </span>
              <button
                type="button"
                disabled={saving || loadingData}
                onClick={handleSaveAll}
                className="bg-white hover:bg-zinc-200 disabled:opacity-50 text-black text-xs font-bold uppercase tracking-wider px-5 py-3 rounded-lg transition"
              >
                {saving ? 'Guardando...' : 'Guardar cambios'}
              </button>
            </div>
          </div>

          {modalOpen && (
            <div className="fixed inset-0 bg-black/80 z-40 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-zinc-900 border border-zinc-800 rounded-xl w-full max-w-lg p-5 sm:p-6 my-auto">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3 mb-4">
                  <h3 className="text-base font-bold text-white">
                    {formState.id !== null ? 'Editar perfume' : 'Nuevo perfume'}
                  </h3>
                  <button
                    type="button"
                    onClick={() => setModalOpen(false)}
                    className="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white w-8 h-8 rounded-lg text-xs"
                  >
                    <i className="fas fa-times"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveModal} className="space-y-4">
                  <div>
                    <label className="block text-xs uppercase tracking-wider text-zinc-300 mb-1">
                      Nombre (1-80)
                    </label>
                    <input
                      type="text"
                      maxLength={80}
                      value={formState.name}
                      onChange={(e) => setFormState((prev) => ({ ...prev, name: e.target.value }))}
                      className="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-white"
                    />
                    <p className="text-[11px] text-zinc-400 mt-1">
                      Incluye la marca en el nombre: Lattafa, Rasasi, Afnan, Armaf, Al Haramain
                    </p>
                  </div>

                  <div>
                    <label className="block text-xs uppercase tracking-wider text-zinc-300 mb-1">
                      Descripción (0-300)
                    </label>
                    <textarea
                      rows={3}
                      maxLength={300}
                      value={formState.desc}
                      onChange={(e) => setFormState((prev) => ({ ...prev, desc: e.target.value }))}
                      className="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-white"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs uppercase tracking-wider text-zinc-300 mb-1">
                        Precio entero en S/ (0-5000)
                      </label>
                      <input
                        type="text"
                        inputMode="numeric"
                        value={formState.price}
                        onChange={(e) => handlePriceInputChange(e.target.value)}
                        className="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-white"
                      />
                    </div>

                    <div className="flex items-end pb-1">
                      <label className="inline-flex items-center gap-2.5 text-xs font-semibold text-white cursor-pointer">
                        <input
                          type="checkbox"
                          checked={Boolean(formState.active)}
                          onChange={(e) => setFormState((prev) => ({ ...prev, active: e.target.checked }))}
                          className="w-4 h-4 accent-white"
                        />
                        <span>Activo en tienda</span>
                      </label>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs uppercase tracking-wider text-zinc-300 mb-1">
                      URL de imagen HTTPS (máx. 500)
                    </label>
                    <input
                      type="url"
                      maxLength={500}
                      value={formState.img}
                      onChange={(e) => setFormState((prev) => ({ ...prev, img: e.target.value }))}
                      placeholder="https://..."
                      className="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-white"
                    />
                    {isGoogleImageUrl(formState.img) && (
                      <p className="text-xs text-zinc-200 bg-zinc-950 border border-zinc-700 rounded-lg p-2.5 mt-2">
                        Aviso: las URLs de google o gstatic puede dejar de funcionar. Usa un enlace directo estable.
                      </p>
                    )}

                    {isValidHttpsUrl(formState.img) && (
                      <div className="mt-3 bg-zinc-950 border border-zinc-800 rounded-lg p-3 flex items-center gap-3">
                        <img
                          src={formState.img}
                          alt="Vista previa"
                          className="w-16 h-16 rounded-lg object-cover border border-zinc-800 bg-black flex-shrink-0"
                        />
                        <div className="text-xs text-zinc-300">
                          <p className="font-bold text-white">Vista previa</p>
                          <p className="text-zinc-400">Precio: S/ {safePreviewPrice}</p>
                        </div>
                      </div>
                    )}
                  </div>

                  {formError && (
                    <p className="text-xs text-white bg-zinc-950 border border-white rounded-lg p-3">
                      {formError}
                    </p>
                  )}

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setModalOpen(false)}
                      className="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white text-xs font-semibold px-4 py-2.5 rounded-lg"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="bg-white hover:bg-zinc-200 text-black text-xs font-bold uppercase tracking-wider px-4 py-2.5 rounded-lg"
                    >
                      Aceptar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {deleteTarget && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-white rounded-xl w-full max-w-sm p-5">
                <h3 className="text-base font-bold text-white">Confirmar eliminación</h3>
                <p className="text-xs text-zinc-300 mt-2 leading-relaxed">
                  ¿Deseas quitar <span className="font-bold text-white">{deleteTarget.name}</span> del catálogo?
                </p>
                <div className="flex justify-end gap-2 mt-5">
                  <button
                    type="button"
                    onClick={() => setDeleteTarget(null)}
                    className="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white text-xs font-semibold px-3.5 py-2 rounded-lg"
                  >
                    Cancelar
                  </button>
                  <button
                    type="button"
                    onClick={confirmDeletePerfume}
                    className="bg-zinc-950 hover:bg-zinc-800 border border-white text-white text-xs font-bold px-3.5 py-2 rounded-lg"
                  >
                    Eliminar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminApp />);
  </script>
</body>
</html>
